name: App deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: souzi-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build web assets for GitHub Pages
        run: |
          pnpm test
          VITE_BASE_PATH=/souzi/ VITE_OUT_DIR=dist-pages pnpm build

      - name: Upload Pages site
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: dist-pages
          retention-days: 30

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web site artifact
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: dist-pages

      - name: Deploy to gh-pages (preserve dictionary packs)
        run: |
          git config user.name "souzi-bot"
          git config user.email "actions@users.noreply.github.com"

          site_dir="$RUNNER_TEMP/site"
          rm -rf "$site_dir"
          mkdir -p "$site_dir"

          # Fetch the existing gh-pages branch if it exists and re-attach
          # previously published dictionary packs only — nothing else.
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch --quiet origin gh-pages
            if git cat-file -e "origin/gh-pages:ecdict" 2>/dev/null; then
              git archive "origin/gh-pages" ecdict | tar -x -C "$site_dir"
            fi
          fi

          # Copy just the freshly built web assets in.
          cp -a dist-pages/. "$site_dir"/

          # Build the commit without ever checking out gh-pages in this
          # working tree (avoids conflicts with the main source tree).
          export GIT_WORK_TREE="$site_dir"
          export GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages-index"
          git read-tree --empty
          git add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "deploy web app")
          git update-ref refs/heads/gh-pages "$commit"
          git push --force origin refs/heads/gh-pages:gh-pages

  build-apk:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets (root base for Capacitor)
        run: pnpm build

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > android/app/android-release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/android-release.keystore" >>"$GITHUB_ENV"

      - name: Compute version
        id: version
        run: |
          version_name="${GITHUB_REF#refs/tags/app-v}"
          version_name="${version_name:-manual}"
          # versionCode grows with run number so Obtainium always sees an update.
          version_code="100000"
          version_code=$((version_code + GITHUB_RUN_NUMBER))
          echo "name=$version_name" >>"$GITHUB_OUTPUT"
          echo "code=$version_code" >>"$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             souzi-${{ steps.version.outputs.name }}.apk
          sha256sum souzi-${{ steps.version.outputs.name }}.apk

      - name: Create APK release
        uses: softprops/action-gh-release@v2
        with:
          name: Souzi ${{ steps.version.outputs.name }}
          body: |
            Souzi Android app (signed release).

            Install with Obtainium or sideload. Bug reports welcome.
          files: souzi-${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Check Google Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build release AAB (for Google Play)
        if: steps.play.outputs.enabled == 'true'
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Upload to Google Play (internal track)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.amoshydra.souzi
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

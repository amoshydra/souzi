name: Dictionary pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dictionary data version (integer, e.g. 2 for v2)"
        required: false
        default: "1"
  push:
    tags:
      - "dict-v*"

permissions:
  contents: write

concurrency:
  group: dictionary
  cancel-in-progress: true

env:
  # Pinned ECDICT source commit (MIT licensed).
  ECDICT_REF: ab22ad36302cafc6349a050e2b60894855208055
  ECDICT_URL: https://raw.githubusercontent.com/skywind3000/ECDICT/ab22ad36302cafc6349a050e2b60894855208055/ecdict.csv

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/dict-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/dict-v}" >>"$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '1' }}" >>"$GITHUB_OUTPUT"
          fi

      - name: Download ECDICT source
        run: |
          curl --fail --location --retry 3 \
            -o ecdict.csv \
            "$ECDICT_URL"
          echo "ecdict.csv size: $(du -h ecdict.csv | cut -f1)"

      - name: Build SQLite pack
        run: |
          python3 scripts/build-ecdict-full.py \
            --input ecdict.csv \
            --output-dir build/ecdict \
            --version "${{ steps.version.outputs.version }}" \
            --base-url https://amoshydra.github.io/souzi/ecdict \
            --source-commit "$ECDICT_REF"

      - name: Inspect output
        run: ls -lh build/ecdict/ build/ecdict/v${{ steps.version.outputs.version }}/

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecdict-pack-v${{ steps.version.outputs.version }}
          path: |
            build/ecdict/v${{ steps.version.outputs.version }}/
            build/ecdict/manifest.json
          if-no-files-found: error

      - name: Create release with pack
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dict-v${{ steps.version.outputs.version }}
          name: Dictionary pack v${{ steps.version.outputs.version }}
          body: |
            Optional full English dictionary pack (ECDICT, MIT license).

            - pack: `ecdict-full-v${{ steps.version.outputs.version }}.sqlite.gz`
            - sha256: see `manifest.json`
            - source: ECDICT @ ${{ env.ECDICT_REF }}
          files: |
            build/ecdict/v${{ steps.version.outputs.version }}/ecdict-full-v${{ steps.version.outputs.version }}.sqlite.gz
            build/ecdict/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages-data:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: ecdict-pack-v${{ needs.build.outputs.version }}
          path: build/ecdict

      - name: Deploy to gh-pages (preserve other versions)
        run: |
          git config user.name "souzi-bot"
          git config user.email "actions@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth 1
            git checkout gh-pages
            git pull --ff-only origin gh-pages || true
          else
            git checkout --orphan gh-pages
            git rm --cached -r . >/dev/null 2>&1 || true
          fi

          mkdir -p ecdict
          cp -r build/ecdict/. ecdict/
          git add ecdict
          git commit -m "deploy dictionary pack v${{ needs.build.outputs.version }}" --allow-empty
          git push origin gh-pages

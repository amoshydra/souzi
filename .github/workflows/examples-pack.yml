name: Examples pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pack version
        required: true
        default: "1"
  push:
    tags:
      - "examples-v*"

permissions:
  contents: write

concurrency:
  group: examples-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/examples-v}"
          fi
          echo "value=$version" >>"$GITHUB_OUTPUT"

      - name: Download Tatoeba exports
        run: |
          mkdir -p /tmp/tatoeba
          curl -fsSL --retry 3 \
            -o /tmp/tatoeba/eng-cmn_links.tsv.bz2 \
            https://downloads.tatoeba.org/exports/per_language/eng/eng-cmn_links.tsv.bz2
          curl -fsSL --retry 3 \
            -o /tmp/tatoeba/eng_sentences.tsv.bz2 \
            https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2
          curl -fsSL --retry 3 \
            -o /tmp/tatoeba/cmn_sentences.tsv.bz2 \
            https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences.tsv.bz2

      - name: Build examples pack
        run: |
          version="${{ steps.version.outputs.value }}"
          python3 scripts/build-tatoeba-examples.py \
            --links /tmp/tatoeba/eng-cmn_links.tsv.bz2 \
            --eng /tmp/tatoeba/eng_sentences.tsv.bz2 \
            --cmn /tmp/tatoeba/cmn_sentences.tsv.bz2 \
            --output-dir build/examples \
            --version "$version" \
            --base-url "https://raw.githubusercontent.com/amoshydra/souzi/dict-manifest/examples/v${version}"

      - name: Publish to dict-manifest
        run: |
          version="${{ steps.version.outputs.value }}"
          git config user.name "souzi-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin dict-manifest
          git worktree add /tmp/dict-manifest -B dict-manifest origin/dict-manifest

          mkdir -p "/tmp/dict-manifest/examples/v${version}"
          cp "build/examples/souzi-examples-v${version}.json.gz" \
            "/tmp/dict-manifest/examples/v${version}/"
          cp build/examples/manifest.json /tmp/dict-manifest/examples/manifest.json

          cd /tmp/dict-manifest
          git add -A examples
          if git diff --cached --quiet; then
            echo "No pack changes to publish."
            exit 0
          fi
          git commit -m "examples: publish v${version}"
          git push origin HEAD:dict-manifest

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: examples-pack-v${{ steps.version.outputs.value }}
          path: build/examples
          retention-days: 30

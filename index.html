<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Ciqiao is an offline-first English–Chinese dictionary. Import CC-CEDICT locally to unlock 125,000 entries."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1411" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ciqiao" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("ciqiao-theme");
          var dark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          /* localStorage can be unavailable in private modes. */
        }
      })();
    </script>
    <title>Ciqiao — Chinese Dictionary</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

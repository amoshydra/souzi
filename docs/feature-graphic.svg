<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="Souzi feature graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a31"/>
      <stop offset="1" stop-color="#2a6b5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#f7f3e8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f7f3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>
  <circle cx="930" cy="60" r="180" fill="#f7f3e8" opacity="0.04"/>
  <circle cx="70" cy="470" r="150" fill="#c2553f" opacity="0.1"/>

  <!-- logo mark -->
  <g transform="translate(80 120) scale(0.62)">
    <circle cx="236" cy="230" r="118" fill="none" stroke="#f7f3e8" stroke-width="30" stroke-linecap="round"/>
    <line x1="322" y1="316" x2="402" y2="396" stroke="#f7f3e8" stroke-width="40" stroke-linecap="round"/>
    <circle cx="402" cy="396" r="16" fill="#c2553f"/>
    <text x="236" y="222" text-anchor="middle" dominant-baseline="central"
          font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif"
          font-size="160" font-weight="600" fill="#f7f3e8">字</text>
  </g>

  <!-- wordmark and copy -->
  <g font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif">
    <text x="430" y="210" font-size="110" font-weight="700" letter-spacing="-2" fill="#f7f3e8">Souzi</text>
    <text x="430" y="282" font-size="54" font-weight="500" fill="#c2553f">搜字</text>
    <line x1="432" y1="322" x2="502" y2="322" stroke="#c2553f" stroke-width="4" opacity="0.65"/>
    <text x="430" y="368" font-size="32" font-weight="400" fill="#f7f3e8">Offline English–Chinese dictionary</text>
    <text x="430" y="412" font-size="24" font-weight="400" fill="#dfece5" opacity="0.85">No account · No tracking · Works offline</text>
  </g>
</svg>

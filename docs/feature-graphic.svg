<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="Souzi feature graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a31"/>
      <stop offset="1" stop-color="#2a6b5a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- decorative circles -->
  <circle cx="900" cy="80" r="180" fill="#f7f3e8" opacity="0.05"/>
  <circle cx="120" cy="420" r="140" fill="#c2553f" opacity="0.12"/>
  <!-- logo mark -->
  <g transform="translate(120 120) scale(0.5)">
    <circle cx="236" cy="230" r="118" fill="none" stroke="#f7f3e8" stroke-width="30" stroke-linecap="round"/>
    <line x1="322" y1="316" x2="402" y2="396" stroke="#f7f3e8" stroke-width="40" stroke-linecap="round"/>
    <circle cx="402" cy="396" r="16" fill="#c2553f"/>
    <text x="236" y="222" text-anchor="middle" dominant-baseline="central"
          font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif"
          font-size="160" font-weight="600" fill="#f7f3e8">字</text>
  </g>
  <!-- title -->
  <text x="360" y="230" font-family="sans-serif" font-size="120" font-weight="700" fill="#f7f3e8">Souzi</text>
  <text x="360" y="300" font-family="sans-serif" font-size="56" font-weight="500" fill="#c2553f">搜字</text>
  <text x="360" y="360" font-family="sans-serif" font-size="34" font-weight="400" fill="#dfece5">Offline English–Chinese dictionary</text>
  <text x="360" y="405" font-family="sans-serif" font-size="26" font-weight="400" fill="#dfece5" opacity="0.8">No account · No tracking · Works offline</text>
</svg>

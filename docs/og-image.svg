<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Souzi — offline English–Chinese dictionary">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a31"/>
      <stop offset="1" stop-color="#2a6b5a"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.78" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#f7f3e8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f7f3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <circle cx="1080" cy="70" r="210" fill="#f7f3e8" opacity="0.04"/>
  <circle cx="80" cy="590" r="170" fill="#c2553f" opacity="0.1"/>

  <!-- logo mark -->
  <g transform="translate(80 160) scale(0.8)">
    <circle cx="236" cy="230" r="118" fill="none" stroke="#f7f3e8" stroke-width="30" stroke-linecap="round"/>
    <line x1="322" y1="316" x2="402" y2="396" stroke="#f7f3e8" stroke-width="40" stroke-linecap="round"/>
    <circle cx="402" cy="396" r="16" fill="#c2553f"/>
    <text x="236" y="222" text-anchor="middle" dominant-baseline="central"
          font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif"
          font-size="160" font-weight="600" fill="#f7f3e8">字</text>
  </g>

  <!-- wordmark and copy -->
  <g font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif">
    <text x="520" y="250" font-size="128" font-weight="700" letter-spacing="-2" fill="#f7f3e8">Souzi</text>
    <text x="520" y="332" font-size="64" font-weight="500" fill="#c2553f">搜字</text>
    <line x1="522" y1="378" x2="602" y2="378" stroke="#c2553f" stroke-width="4" opacity="0.65"/>
    <text x="520" y="432" font-size="38" font-weight="400" fill="#f7f3e8">Offline English–Chinese dictionary</text>
    <text x="520" y="486" font-size="26" font-weight="400" fill="#dfece5" opacity="0.85">No account · No tracking · Works offline</text>
    <text x="520" y="560" font-size="22" font-weight="400" fill="#dfece5" opacity="0.55">amoshydra.github.io/souzi</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Souzi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a31"/>
      <stop offset="1" stop-color="#2a6b5a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- magnifying glass lens -->
  <circle cx="236" cy="230" r="118" fill="none" stroke="#f7f3e8" stroke-width="26" stroke-linecap="round"/>
  <!-- handle -->
  <line x1="322" y1="316" x2="402" y2="396" stroke="#f7f3e8" stroke-width="34" stroke-linecap="round"/>
  <!-- accent dot (the "search" spark) -->
  <circle cx="402" cy="396" r="14" fill="#c2553f"/>
  <!-- Hanzi 字 inside lens -->
  <g stroke="#f7f3e8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="176" y1="172" x2="296" y2="172"/>
    <line x1="196" y1="200" x2="276" y2="200"/>
    <line x1="186" y1="232" x2="286" y2="232"/>
    <line x1="236" y1="172" x2="236" y2="290"/>
    <line x1="236" y1="260" x2="196" y2="300"/>
    <line x1="236" y1="260" x2="276" y2="300"/>
  </g>
</svg>
